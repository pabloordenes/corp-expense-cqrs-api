name: CI Build and Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CorpExpenseApi.slnx

      - name: Build
        run: dotnet build CorpExpenseApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CorpExpenseApi.slnx --configuration Release --no-build --verbosity normal